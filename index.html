  // ====== 멤버관리 탭 ======

  async function loadMembersTab() {
    const el = $("membersTabContent");
    if (!el) return;
    el.innerHTML = `<div class="muted">불러오는 중...</div>`;

    const seasonId = seasonIdOrNull();

    try {
      // 병렬 조회: 프로필, 시즌 참여, 모든 시즌 목록(기록 기준)
      const [profilesRes, seasonMembersRes, allLogsRes] = await Promise.all([
        supabase.from("profiles")
          .select("id, display_name, rank_override, suspended_at, created_at, bio")
          .order("display_name"),
        seasonId
          ? supabase.from("season_members").select("user_id, is_active").eq("season_id", seasonId)
          : Promise.resolve({ data: [] }),
        supabase.from("reading_logs")
          .select("user_id, season_id, date")
          .eq("archived", false)
      ]);

      if (profilesRes.error) throw profilesRes.error;

      const profiles = profilesRes.data || [];
      if (profiles.length === 0) {
        el.innerHTML = `<div class="muted">등록된 멤버가 없습니다.</div>`;
        return;
      }

      // 시즌 참여 맵 { user_id: is_active }
      const seasonStatusMap = {};
      (seasonMembersRes.data || []).forEach(r => { seasonStatusMap[r.user_id] = r.is_active; });

      // 유저별 통계 & 참여 시즌 목록 계산
      const allLogs = allLogsRes.data || [];
      const statsMap = {}; // { userId: { logCount, participatedSeasons: Set } }
      allLogs.forEach(log => {
        if (!statsMap[log.user_id]) statsMap[log.user_id] = { logCount: 0, seasons: new Set() };
        statsMap[log.user_id].logCount++;
        const sid = log.season_id || "(시즌 없음)";
        statsMap[log.user_id].seasons.add(sid);
      });

      // 댓글 수 (병렬)
      const commentCounts = await Promise.all(
        profiles.map(p =>
          supabase.from("comments")
            .select("id", { count: "exact", head: true })
            .eq("user_id", p.id)
            .then(r => ({ id: p.id, count: r.count || 0 }))
        )
      );
      const commentCountMap = {};
      commentCounts.forEach(r => { commentCountMap[r.id] = r.count; });

      // 요약 헤더
      const totalMembers = profiles.length;
      const suspendedCount = profiles.filter(p => p.suspended_at).length;
      const seasonLabel = currentSeason?.name || (seasonId || "시즌 미설정");

      el.innerHTML = `
        <div class="member-tab-summary">
          전체 <b>${totalMembers}명</b>
          ${suspendedCount > 0 ? ` · 정지 <b style="color:#c0392b">${suspendedCount}명</b>` : ""}
          · 현재 시즌: <b>${escapeHtml(seasonLabel)}</b>
        </div>
        <div id="memberCardList"></div>
      `;

      const listEl = $("memberCardList");

      profiles.forEach(p => {
        const stats = statsMap[p.id] || { logCount: 0, seasons: new Set() };
        const commentCount = commentCountMap[p.id] || 0;
        const isSuspended = !!p.suspended_at;
        const suspendedAtStr = p.suspended_at
          ? new Date(p.suspended_at).toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric" })
          : null;

        // 가입일
        const joinedStr = p.created_at
          ? new Date(p.created_at).toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric" })
          : "알 수 없음";

        // 현재 시즌 참여 상태
        const currentSeasonActive = seasonId
          ? ((p.id in seasonStatusMap) ? seasonStatusMap[p.id] : true)
          : null;

        const seasonBadge = seasonId
          ? (currentSeasonActive
              ? `<span class="member-status-badge active">참여 중</span>`
              : `<span class="member-status-badge inactive">미참여</span>`)
          : `<span class="member-status-badge" style="background:var(--bg-secondary);color:var(--text-muted);border:1px solid var(--border-light);">시즌 미설정</span>`;

        // 참여 시즌 태그
        const seasonChips = stats.seasons.size > 0
          ? [...stats.seasons].map(s => `<span class="member-season-chip">${escapeHtml(s)}</span>`).join("")
          : `<span class="member-season-chip no-season">기록 없음</span>`;

        // 현재 등급 (override 우선)
        const autoRank = calcRank(stats.logCount, commentCount, 0).current;
        const displayRankKey = p.rank_override || autoRank.key;
        const displayRank = RANKS.find(r => r.key === displayRankKey) || autoRank;
        const rankOverrideLabel = p.rank_override ? " (수동)" : " (자동)";

        // 등급 선택 드롭다운
        const rankOptions = RANKS.map(r =>
          `<option value="${r.key}" ${r.key === displayRankKey ? "selected" : ""}>${r.emoji} ${r.name}</option>`
        ).join("");

        const card = document.createElement("div");
        card.className = `member-card${isSuspended ? " suspended" : ""}`;
        card.dataset.uid = p.id;
        card.innerHTML = `
          <div class="member-card-head">
            <span class="member-card-name">${escapeHtml(p.display_name || "이름 없음")}</span>
            <span class="rank-badge ${displayRank.cssClass}">${displayRank.emoji} ${displayRank.name}${rankOverrideLabel}</span>
            ${isSuspended ? `<span class="suspended-badge">🚫 정지중</span>` : ""}
            ${seasonBadge}
          </div>
          <div class="member-card-stats">
            <span class="member-stat-chip">📅 가입: ${joinedStr}</span>
            <span class="member-stat-chip">📖 기록 ${stats.logCount}개</span>
            <span class="member-stat-chip">💬 댓글 ${commentCount}개</span>
            ${isSuspended ? `<span class="member-stat-chip" style="color:#c0392b;">정지일: ${suspendedAtStr}</span>` : ""}
          </div>
          <div style="font-size:.74rem;color:var(--text-muted);margin-bottom:.4rem;">참여 시즌</div>
          <div class="member-season-list">${seasonChips}</div>
          <div class="member-card-bio">
            <label style="font-size:.78rem;color:var(--text-muted);display:block;margin-bottom:.3rem;">자기소개</label>
            <textarea class="member-bio-input" data-uid="${p.id}" placeholder="이 멤버의 자기소개를 입력하세요." style="min-height:70px;width:100%;font-size:.82rem;">${escapeHtml(p.bio || "")}</textarea>
            <button class="action-btn" data-action="save-bio" data-uid="${p.id}" style="margin-top:.3rem;">소개 저장</button>
            <span class="member-bio-status" data-uid="${p.id}" style="font-size:.74rem;color:var(--text-muted);margin-left:.5rem;"></span>
          </div>
          <div class="member-card-actions">
            <select class="rank-select" data-uid="${p.id}" title="등급 변경">
              ${rankOptions}
            </select>
            <button class="action-btn" data-action="rank" data-uid="${p.id}">등급 적용</button>
            ${p.rank_override ? `<button class="action-btn" data-action="rank-reset" data-uid="${p.id}">자동으로 되돌리기</button>` : ""}
            ${seasonId ? (currentSeasonActive
              ? `<button class="action-btn" data-action="season-deactivate" data-uid="${p.id}">시즌 미참여로 설정</button>`
              : `<button class="action-btn safe" data-action="season-activate" data-uid="${p.id}">시즌 참여로 설정</button>`) : ""}
            ${isSuspended
              ? `<button class="action-btn safe" data-action="unsuspend" data-uid="${p.id}">활동 재개</button>`
              : `<button class="action-btn danger" data-action="suspend" data-uid="${p.id}">활동 정지</button>`}
          </div>
        `;

        // 이벤트
        card.querySelector('[data-action="rank"]').onclick = () => {
          const sel = card.querySelector(`.rank-select[data-uid="${p.id}"]`);
          overrideRank(p.id, sel.value, p.display_name || "멤버");
        };
        const resetBtn = card.querySelector('[data-action="rank-reset"]');
        if (resetBtn) resetBtn.onclick = () => overrideRank(p.id, null, p.display_name || "멤버");

        const sdBtn = card.querySelector('[data-action="season-deactivate"]');
        if (sdBtn) sdBtn.onclick = () => toggleMemberActive(p.id, true, p.display_name || "멤버");
        const saBtn = card.querySelector('[data-action="season-activate"]');
        if (saBtn) saBtn.onclick = () => toggleMemberActive(p.id, false, p.display_name || "멤버");

        const suspendBtn = card.querySelector('[data-action="suspend"]');
        if (suspendBtn) suspendBtn.onclick = () => suspendMember(p.id, p.display_name || "멤버");
        const unsuspendBtn = card.querySelector('[data-action="unsuspend"]');
        if (unsuspendBtn) unsuspendBtn.onclick = () => unsuspendMember(p.id, p.display_name || "멤버");

        const saveBioAdminBtn = card.querySelector('[data-action="save-bio"]');
        if (saveBioAdminBtn) saveBioAdminBtn.onclick = async () => {
          const ta = card.querySelector(`.member-bio-input[data-uid="${p.id}"]`);
          const st = card.querySelector(`.member-bio-status[data-uid="${p.id}"]`);
          if (!ta) return;
          const { error } = await supabase.from("profiles")
            .update({ bio: ta.value.trim() || null })
            .eq("id", p.id);
          if (st) st.textContent = error ? "저장 실패" : "저장됨 ✓";
          if (!error) setTimeout(() => { if (st) st.textContent = ""; }, 2000);
        };

        listEl.appendChild(card);
      });

    } catch (e) {
      console.error("loadMembersTab error:", e);
      el.innerHTML = `<div class="muted">멤버 정보를 불러오지 못했습니다.</div>`;
    }
  }

  async function overrideRank(userId, rankKey, displayName) {
    const label = rankKey ? `'${RANKS.find(r=>r.key===rankKey)?.name || rankKey}'으로 수동 지정` : "자동 계산으로 초기화";
    if (!confirm(`${displayName} 님의 등급을 ${label}하시겠습니까?`)) return;

    const { error } = await supabase
      .from("profiles")
      .update({ rank_override: rankKey })
      .eq("id", userId);

    if (error) {
      console.error("overrideRank error:", error);
      alert("등급 변경에 실패했습니다: " + error.message);
      return;
    }
    await loadMembersTab();
  }

  async function suspendMember(userId, displayName) {
    if (!confirm(`${displayName} 님을 활동 정지하시겠습니까?\n\n정지 이후의 클럽 기록과 아카이브는 열람할 수 없게 됩니다.`)) return;

    const now = new Date().toISOString();
    const { error } = await supabase
      .from("profiles")
      .update({ suspended_at: now })
      .eq("id", userId);

    if (error) {
      console.error("suspendMember error:", error);
      alert("정지 처리에 실패했습니다: " + error.message);
      return;
    }
    await loadMembersTab();
  }

  async function unsuspendMember(userId, displayName) {
    if (!confirm(`${displayName} 님의 활동 정지를 해제하시겠습니까?`)) return;

    const { error } = await supabase
      .from("profiles")
      .update({ suspended_at: null })
      .eq("id", userId);

    if (error) {
      console.error("unsuspendMember error:", error);
      alert("정지 해제에 실패했습니다: " + error.message);
      return;
    }
    await loadMembersTab();
  }

  // ====== 멤버 시즌 참여 관리 ======

  async function loadMemberManager() {
    const el = $("memberManagerList");
    if (!el) return;
    el.innerHTML = `<div class="muted">불러오는 중...</div>`;

    const seasonId = seasonIdOrNull();
    if (!seasonId) {
      el.innerHTML = `<div class="muted">현재 설정된 시즌이 없습니다. 시즌 ID를 먼저 설정해 주세요.</div>`;
      return;
    }

    try {
      // 모든 프로필 + 현재 시즌 참여 상태 병렬 조회
      const [profilesRes, membersRes] = await Promise.all([
        supabase.from("profiles").select("id, display_name").order("display_name"),
        supabase.from("season_members").select("user_id, is_active").eq("season_id", seasonId)
      ]);

      if (profilesRes.error) throw profilesRes.error;

      const profiles = profilesRes.data || [];
      if (profiles.length === 0) {
        el.innerHTML = `<div class="muted">등록된 멤버가 없습니다.</div>`;
        return;
      }

      // season_members 맵 { user_id: is_active }
      const memberStatusMap = {};
      (membersRes.data || []).forEach(r => { memberStatusMap[r.user_id] = r.is_active; });

      el.innerHTML = "";
      profiles.forEach(p => {
        // 레코드 없으면 기본 활성
        const isActive = (p.id in memberStatusMap) ? memberStatusMap[p.id] : true;
        const name = escapeHtml(p.display_name || "이름 없음");
        const statusLabel = isActive ? "참여 중" : "미참여";
        const statusClass = isActive ? "active" : "inactive";
        const btnLabel = isActive ? "비활성으로 설정" : "활성으로 설정";
        const btnClass = isActive ? "deactivate" : "";

        const row = document.createElement("div");
        row.className = "member-row";
        row.innerHTML = `
          <div class="member-row-info">
            <span class="member-row-name">${name}</span>
            <span class="member-row-meta">${p.id.slice(0,8)}…</span>
          </div>
          <span class="member-status-badge ${statusClass}">${statusLabel}</span>
          <button class="member-toggle-btn ${btnClass}" data-uid="${p.id}" data-active="${isActive}">${btnLabel}</button>
        `;
        row.querySelector(".member-toggle-btn").onclick = () => toggleMemberActive(p.id, isActive, p.display_name || "멤버");
        el.appendChild(row);
      });
    } catch (e) {
      console.error("loadMemberManager error:", e);
      el.innerHTML = `<div class="muted">멤버 목록을 불러오지 못했습니다.</div>`;
    }
  }

  async function toggleMemberActive(userId, currentlyActive, displayName) {
    const seasonId = seasonIdOrNull();
    if (!seasonId) { alert("시즌 ID가 설정되어 있지 않습니다."); return; }

    const nextActive = !currentlyActive;
    const actionLabel = nextActive ? "활성(참여 중)" : "비활성(미참여)";
    if (!confirm(`${displayName} 님을 '${actionLabel}'으로 변경하시겠습니까?`)) return;

    // upsert: 레코드가 있으면 업데이트, 없으면 삽입
    const { error } = await supabase
      .from("season_members")
      .upsert(
        { user_id: userId, season_id: seasonId, is_active: nextActive },
        { onConflict: "user_id,season_id" }
      );

    if (error) {
      console.error("toggleMemberActive error:", error);
      alert("변경에 실패했습니다: " + error.message);
      return;
    }

    // 관리자 목록 새로고침
    await loadMemberManager();
    // 클럽 기록도 갱신
    if ($("clubLogsList")) await loadClubLogs();
  }

  // 부팅 시 내 시즌 참여 상태 + 정지 상태 로드
  async function loadMySeasonStatus() {
    if (!sessionUser) { mySeasonActive = true; mySuspendedAt = null; return; }

    const seasonId = seasonIdOrNull();

    try {
      // 시즌 참여 + 정지 상태 병렬 조회
      const [seasonRes, profileRes] = await Promise.all([
        seasonId
          ? supabase.from("season_members").select("is_active")
              .eq("user_id", sessionUser.id).eq("season_id", seasonId).maybeSingle()
          : Promise.resolve({ data: null }),
        supabase.from("profiles").select("suspended_at")
          .eq("id", sessionUser.id).maybeSingle()
      ]);

      mySeasonActive = (seasonRes.data == null) ? true : seasonRes.data.is_active;
      mySuspendedAt = profileRes.data?.suspended_at || null;
    } catch (e) {
      mySeasonActive = true;
      mySuspendedAt = null;
    }
  }

  async function loadAdminList() {
    const el = $("adminList");
    if (!el) return;
    el.innerHTML = `<div class="muted">불러오는 중...</div>`;
    try {
      const { data, error } = await supabase.from("admin_users").select("user_id").order("user_id", { ascending:true });
      if (error) {
        console.error("loadAdminList error:", error);
        el.innerHTML = `<div class="muted">관리자 목록을 불러오지 못했습니다.</div>`;
        return;
      }
      if (!data || data.length === 0) {
        el.innerHTML = `<div class="muted">등록된 관리자가 없습니다.</div>`;
        return;
      }
      el.innerHTML = "";
      data.forEach(r => {
        const d = document.createElement("div");
        d.className = "log-item";
        d.innerHTML = `<div class="log-head"><span>${escapeHtml(r.user_id)}</span><span class="pill">admin</span></div>`;
        el.appendChild(d);
      });
    } catch (e) {
      el.innerHTML = `<div class="muted">관리자 목록을 불러오지 못했습니다.</div>`;
    }
  }

  // ====== BOOT ======
  async function boot() {
    wireModalEvents();
    await loadClubSettings();

    const session = await getSession();
    if (!session || !session.user) {
      renderLogin();
      return;
    }

    sessionUser = session.user;

    await ensureProfile(sessionUser);
    await checkAdmin(sessionUser);

    renderUserArea();
    // 시즌 참여 상태 로드 후 renderApp (클럽 기록 필터링에 필요)
    await loadMySeasonStatus();
    renderApp();
    setupArchiveScroll();

    // 알림: 부팅 시 미확인 댓글 확인 + Realtime 구독
    await checkUnreadComments();
    subscribeComments();

    appBooted = true;
  }

  // Handle auth changes
  supabase.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session?.user) {
    if (appBooted) {
      console.warn("Auth event ignored: app already booted");
      return;
    }
    boot();
    }

    if (event === "SIGNED_OUT") {
        appBooted = false;
        renderLogin();
    }
   });

  boot();
})();</script>
</body>

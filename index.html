<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>내곁에북클럽 – Daily Reading Log</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root{
      color-scheme: light dark;
      /* Warm Light Palette */
      --bg-primary: #faf6f1;
      --bg-secondary: #f5ede4;
      --bg-card: #fffcf7;
      --bg-input: #faf6f1;
      --text-primary: #3d3229;
      --text-secondary: #6b5c4c;
      --text-muted: #8c7b6b;
      --border-color: #e6ddd3;
      --border-light: #efe7dd;
      --accent: #a85d3b;
      --accent-hover: #8f4e30;
      --accent-light: #f8efe8;
      --accent-text: #7c4a2d;
      --pill-bg: #f0e6db;
      --pill-text: #7c5d45;
      --shadow-soft: rgba(61, 50, 41, 0.06);
      --shadow-medium: rgba(61, 50, 41, 0.12);
    }

    /* ====== 봄 배경 — 매화 가지 캔버스 ====== */
    body{
      margin:0;
      font-family: "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      position: relative;
    }

    #blossom-canvas{
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
    }

    /* 앱 컨텐츠는 배경 위에 */
    .app-shell{ position: relative; z-index: 1; }
    #toastContainer{ position: relative; z-index: 1000; }
    #modalBackdrop{ z-index: 500; }

    @media (prefers-color-scheme: dark){
      #blossom-canvas{ opacity: 0.10; }
    }

    /* Serif font for headings */
    h1, h2, .logo, .modal-title {
      font-family: "Noto Serif KR", Georgia, "Times New Roman", serif;
    }

    .app-shell{ max-width: 720px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; box-sizing:border-box; }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:.75rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-light);
    }

    .logo{
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.3;
      color: var(--text-primary);
    }
    .logo span{
      display: block;
      font-family: "Apple SD Gothic Neo", system-ui, sans-serif;
      font-weight: 400;
      font-size: .78rem;
      color: var(--text-muted);
      margin-top: .25rem;
      letter-spacing: 0.02em;
    }

    .chip-row{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; }

    .user-chip{
      font-size: .82rem;
      padding: .35rem .85rem;
      border-radius: 20px;
      background: var(--text-primary);
      color: var(--bg-card);
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-weight: 500;
    }
    .user-chip button{
      background: transparent;
      border: none;
      color: inherit;
      font-size: .8rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.85;
    }
    .user-chip button:hover{ opacity: 1; }

    .badge{
      display: none;
      font-size: .72rem;
      padding: .2rem .6rem;
      border-radius: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      font-weight: 600;
    }

    .tabs{
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 1rem 0 1.2rem;
      padding-bottom: .8rem;
      border-bottom: 1px solid var(--border-light);
    }
    .tab{
      border-radius: 20px;
      border: 1px solid var(--border-color);
      padding: .45rem 1rem;
      font-size: .85rem;
      cursor: pointer;
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .tab:hover{
      border-color: var(--accent);
      color: var(--accent);
    }
    .tab.active{
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .card{
      background: var(--bg-card);
      border-radius: 20px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px var(--shadow-soft), 0 1px 2px var(--shadow-soft);
      border: 1px solid var(--border-light);
    }

    h2{
      font-size: 1.1rem;
      margin: 0 0 .5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .subtitle{
      font-size: .84rem;
      color: var(--text-muted);
      margin-bottom: .85rem;
      line-height: 1.5;
    }

    label{
      font-size: .82rem;
      display: block;
      margin: .7rem 0 .2rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    input[type="text"], input[type="date"], textarea, select{
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: .6rem .8rem;
      font-size: .92rem;
      font-family: inherit;
      background: var(--bg-input);
      color: var(--text-primary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="text"]:focus, input[type="date"]:focus, textarea:focus, select:focus{
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    textarea{ min-height: 90px; resize: vertical; line-height: 1.5; }

    .row{ display: flex; flex-wrap: wrap; gap: .75rem; }
    .row>div{ flex: 1 1 180px; }

    .btn-row{ display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }

    button.primary{
      width: 100%;
      border-radius: 24px;
      border: none;
      padding: .7rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button.primary:hover{ background: var(--accent-hover); }
    button.primary:active{ transform: scale(0.98); }

    button.secondary{
      width: 100%;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      padding: .7rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    button.secondary:hover{ border-color: var(--text-muted); }

    .muted{ font-size: .82rem; color: var(--text-muted); }

    .logs-list{ display: flex; flex-direction: column; gap: .7rem; margin-top: .4rem; }

    .log-item{
      padding: .85rem 1rem;
      border-radius: 16px;
      border: 1px solid var(--border-light);
      background: var(--bg-secondary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .log-item:hover{
      border-color: var(--border-color);
      box-shadow: 0 2px 6px var(--shadow-soft);
    }

    .log-head{
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      font-size: .78rem;
      margin-bottom: .4rem;
      color: var(--text-muted);
      align-items: center;
    }

    .pill{
      display: inline-flex;
      align-items: center;
      padding: .15rem .6rem;
      border-radius: 12px;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size: .74rem;
      font-weight: 500;
    }
    .pill.archive{
      background: #fef3e2;
      color: #b45309;
    }

    .log-mainline{
      font-size: .9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .log-sub{ margin-top: .3rem; font-size: .85rem; white-space: pre-wrap; color: var(--text-secondary); }

    .comment-count-chip{
      display: inline-flex;
      align-items: center;
      gap: .2rem;
      font-size: .7rem;
      color: var(--text-muted);
      margin-left: .4rem;
      vertical-align: middle;
      opacity: .85;
    }
    .comment-count-chip.has-comments{
      color: var(--accent-text);
      font-weight: 600;
      opacity: 1;
    }

    .item-actions{ margin-top: .65rem; display: flex; gap: .45rem; flex-wrap: wrap; justify-content: flex-end; }

    .edit-link{
      font-size: .72rem;
      color: var(--accent);
      text-decoration: none;
      margin-left: .4rem;
      opacity: 0.7;
    }
    .edit-link:hover{ opacity: 1; text-decoration: underline; }


    .mini-btn{
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      border-radius: 16px;
      padding: .32rem .7rem;
      font-size: .78rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .mini-btn:hover{
      border-color: var(--accent);
      color: var(--accent);
    }
    .mini-btn.primary{
      border-color: var(--accent);
      color: var(--accent);
    }

    .filters{ display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin: .7rem 0 .3rem; }
    .filters .field{ flex: 1 1 180px; }
    .filters label{ margin-top: 0; }

    .field-row{ display: flex; gap: 20px; align-items: flex-end; }
    .field-row .field{ flex: 1; }

    .split{ display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 900px){ .split{ grid-template-columns: 1fr 1fr; } }

    .section-hidden{ display: none; }

    /* Archive selector */
    .archive-selector{
      margin-bottom: 1rem;
      padding: .9rem 1rem;
      background: #fef9f0;
      border: 1px solid #f0dcc8;
      border-radius: 16px;
    }
    .archive-selector label{ margin: 0 0 .35rem; color: var(--accent-text); }
    .archive-selector select{ background: #fffdf8; border-color: #e8d4c0; }

    /* Modal */
    #modalBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(61, 50, 41, 0.5);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 1rem;
      padding-top: 8vh;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }
    #modalBackdrop.open{ display: flex; }

    .modal{
      width: min(680px, 100%);
      max-height: calc(100dvh - 8vh - 2rem - env(safe-area-inset-bottom));
      max-height: calc(100vh  - 8vh - 2rem - env(safe-area-inset-bottom)); /* fallback */
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-card);
      border-radius: 24px;
      border: 1px solid var(--border-light);
      box-shadow: 0 20px 50px rgba(61, 50, 41, 0.25);
    }

    .modal-header{
      position: sticky;
      top: 0;
      background: inherit;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: .8rem;
      padding: 1.1rem 1.25rem .8rem;
      border-bottom: 1px solid var(--border-light);
    }

    .modal-title{ font-weight: 700; font-size: 1.1rem; color: var(--text-primary); }

    .modal-close{
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: .1rem .3rem;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }
    .modal-close:hover{ color: var(--text-primary); }

    .modal-body{ padding: 1rem 1.25rem 1.25rem; }

    .kv{
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: .8rem;
      padding: .65rem 0;
      border-bottom: 1px dashed var(--border-light);
    }
    .kv:last-child{ border-bottom: none; }
    .kv .k{ font-size: .82rem; color: var(--text-muted); font-weight: 500; }
    .kv .v{ font-size: .92rem; white-space: normal; color: var(--text-primary); line-height: 1.5; }

    .modal-footer{ padding: 1rem 1.25rem 1.25rem; border-top: 1px solid var(--border-light); }

    /* button, input adjustments */
    #myLogApply,#clubLogApply{ width: 100%; padding: .5rem .85rem; font-size: .85rem; }

    /* ====== Comments ====== */
    .comment-section{
      margin-top: 1.25rem;
      padding-top: 1rem;
      padding-bottom: 25vh;
      border-top: 1px dashed var(--border-light);
    }
    .comment-section-title{
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: .6rem;
      letter-spacing: .03em;
    }
    .comment-list{ display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    .comment-item{
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: .55rem .8rem;
      font-size: .85rem;
      position: relative;
    }
    .comment-meta{
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: .25rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .comment-author{ font-weight: 600; color: var(--text-secondary); }
    .comment-body{ color: var(--text-primary); white-space: pre-wrap; line-height: 1.5; }
    .comment-delete-btn{
      background: none;
      border: none;
      cursor: pointer;
      font-size: .72rem;
      color: var(--text-muted);
      padding: 0;
      margin-left: auto;
      opacity: .65;
      transition: opacity .15s;
    }
    .comment-delete-btn:hover{ opacity: 1; color: #e74c3c; }
    .comment-form{ display: flex; gap: .5rem; align-items: flex-end; margin-top: .3rem; }
    .comment-form textarea{
      flex: 1;
      min-height: 52px;
      resize: none;
      font-size: .85rem;
      border-radius: 12px;
      padding: .5rem .7rem;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      line-height: 1.45;
    }
    .comment-form textarea:focus{
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .comment-submit-btn{
      border: none;
      border-radius: 12px;
      padding: .5rem .85rem;
      background: var(--accent);
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
      flex-shrink: 0;
    }
    .comment-submit-btn:hover{ background: var(--accent-hover); }
    .comment-submit-btn:disabled{ opacity: .55; cursor: default; }
    .comment-empty{ font-size: .82rem; color: var(--text-muted); }

    /* ====== Toast Notification ====== */
    #toastContainer{
      position: fixed;
      bottom: 1.5rem;
      right: 1.25rem;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      pointer-events: none;
    }
    .toast-item{
      background: var(--text-primary);
      color: var(--bg-card);
      border-radius: 16px;
      padding: .75rem 1.1rem;
      font-size: .85rem;
      line-height: 1.45;
      max-width: 300px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .toast-item.show{
      opacity: 1;
      transform: translateY(0);
    }
    .toast-item .toast-title{
      font-weight: 700;
      margin-bottom: .18rem;
    }
    .toast-item .toast-body{
      opacity: .8;
      font-size: .82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    /* ====== Unread Badge ====== */
    .notif-badge{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: #e74c3c;
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      padding: 0 .35rem;
      margin-left: .35rem;
      vertical-align: middle;
      line-height: 1;
    }

    /* ====== Unread Banner ====== */
    #unreadBanner{
      display: none;
      align-items: center;
      gap: .6rem;
      background: var(--accent-light);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: .6rem 1rem;
      font-size: .84rem;
      color: var(--accent-text);
      margin-bottom: .8rem;
      cursor: pointer;
      transition: background .2s;
    }
    #unreadBanner:hover{ background: #f0ddd1; }
    #unreadBanner .banner-icon{ font-size: 1.1rem; }
    #unreadBanner .banner-text{ flex: 1; font-weight: 500; }
    #unreadBanner .banner-close{
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent-text);
      font-size: 1rem;
      padding: 0;
      opacity: .6;
    }
    #unreadBanner .banner-close:hover{ opacity: 1; }

    /* ====== Rank ====== */
    .rank-badge{
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .78rem;
      font-weight: 700;
      padding: .2rem .65rem;
      border-radius: 20px;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .rank-seed   { background: #f0fce8; color: #4a7c3f; border: 1px solid #c1e6a8; }
    .rank-reader { background: #e8f0fd; color: #2c5fa8; border: 1px solid #a8c4f5; }
    .rank-hot    { background: #fff3e8; color: #b84f10; border: 1px solid #f5c5a0; }
    .rank-master { background: #fdf5e8; color: #9a6a0a; border: 1px solid #f0d080; }
    .rank-legend { background: #f5e8fd; color: #7a2fa8; border: 1px solid #d4a8f5; }

    /* 프로필 등급 카드 */
    .rank-card{
      margin-top: 1.2rem;
      padding: 1rem 1.1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 16px;
    }
    .rank-card-title{
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: .55rem;
      letter-spacing: .03em;
    }
    .rank-main{
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    .rank-emoji{ font-size: 2rem; line-height: 1; }
    .rank-info-name{ font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .rank-info-sub { font-size: .78rem; color: var(--text-muted); margin-top: .1rem; }

    .rank-stats{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .4rem;
      margin-bottom: .75rem;
    }
    .rank-stat{
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: .5rem .4rem;
      text-align: center;
    }
    .rank-stat-val{ font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .rank-stat-lbl{ font-size: .68rem; color: var(--text-muted); margin-top: .1rem; }

    .rank-progress-wrap{ margin-top: .2rem; }
    .rank-progress-label{
      display: flex;
      justify-content: space-between;
      font-size: .74rem;
      color: var(--text-muted);
      margin-bottom: .3rem;
    }
    .rank-progress-bar{
      height: 6px;
      border-radius: 4px;
      background: var(--border-light);
      overflow: hidden;
    }
    .rank-progress-fill{
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width .6s ease;
    }

    /* 클럽 기록 카드 내 작은 등급 뱃지 */
    .log-rank{ margin-left: .3rem; vertical-align: middle; }

    /* ====== 멤버 관리 (기존 admin 탭 내 + 새 멤버관리 탭 공용) ====== */
    .member-row{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .7rem .9rem;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      margin-bottom: .5rem;
    }
    .member-row-info{
      display: flex;
      align-items: center;
      gap: .6rem;
      flex: 1;
      min-width: 0;
    }
    .member-row-name{
      font-weight: 600;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .member-row-meta{
      font-size: .75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .member-status-badge{
      font-size: .72rem;
      font-weight: 700;
      padding: .18rem .55rem;
      border-radius: 20px;
      white-space: nowrap;
    }
    .member-status-badge.active{
      background: #e8fde8;
      color: #2d7a2d;
      border: 1px solid #b0e0b0;
    }
    .member-status-badge.inactive{
      background: #fde8e8;
      color: #9a2d2d;
      border: 1px solid #e0b0b0;
    }
    .member-toggle-btn{
      font-size: .78rem;
      padding: .3rem .8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .member-toggle-btn:hover{

<script>
(function(){
  const canvas = document.getElementById("blossom-canvas");
  const ctx = canvas.getContext("2d");
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  // 시드 기반 난수 (리사이즈해도 꽃 위치 고정)
  let _seed = 20260225;
  function rnd() {
    _seed = (_seed * 1664525 + 1013904223) & 0xffffffff;
    return ((_seed >>> 0) / 0xffffffff);
  }

  // 꽃잎 색상 팔레트 (연한 봄 핑크)
  const palettes = isDark
    ? ["#d4789a","#c06080","#e090b0","#b85878","#cc7090","#e0a0c0","#d060a0"]
    : ["#f0b8cc","#e8a0b8","#f8d0e0","#e090b0","#fce0ec","#f4c0d8","#fad8e8","#eeaac8","#f5c8dc"];
  const stamColors = isDark
    ? ["#f0d080","#e8c870","#f8e090"]
    : ["#fff8cc","#fff0aa","#fffde0"];

  // 5장 꽃잎 매화
  function drawFlower(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate((Math.PI * 2 / 5) * i);
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.82, r * 0.42, r * 0.68, 0, 0, Math.PI * 2);
      ctx.fillStyle = palettes[Math.floor(rnd() * palettes.length)];
      ctx.fill();
      ctx.restore();
    }
    // 꽃술
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = stamColors[Math.floor(rnd() * stamColors.length)];
    ctx.fill();
    ctx.restore();
  }

  // 꽃봉오리 (작은 타원)
  function drawBud(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.45, r * 0.85, 0, 0, Math.PI * 2);
    ctx.fillStyle = palettes[Math.floor(rnd() * palettes.length)];
    ctx.fill();
    ctx.restore();
  }

  // 낙화 꽃잎 (한 장, 타원)
  function drawPetal(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.38, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fillStyle = palettes[Math.floor(rnd() * palettes.length)];
    ctx.fill();
    ctx.restore();
  }

  // 꽃 데이터 미리 생성 (시드 기반으로 고정)
  let flowers = [];
  function generateFlowers(W, H) {
    _seed = 20260225; // 항상 같은 시드로 리셋
    flowers = [];
    const TOTAL = 280; // 전체 꽃+봉오리+낱잎 수

    for (let i = 0; i < TOTAL; i++) {
      const x = rnd() * W;
      const y = rnd() * H;
      const type = rnd(); // 0~0.55: 꽃, 0.55~0.75: 봉오리, 0.75~1: 낱잎
      const rot  = rnd() * Math.PI * 2;

      if (type < 0.55) {
        // 꽃: 다양한 사이즈
        const r = 5 + rnd() * 16; // 5~21px
        flowers.push({ kind: "flower", x, y, r, rot });
      } else if (type < 0.75) {
        // 봉오리: 작게
        const r = 4 + rnd() * 7; // 4~11px
        flowers.push({ kind: "bud", x, y, r, rot });
      } else {
        // 낱잎: 중간 크기
        const r = 4 + rnd() * 10; // 4~14px
        flowers.push({ kind: "petal", x, y, r, rot });
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    flowers.forEach(f => {
      if      (f.kind === "flower") drawFlower(f.x, f.y, f.r, f.rot);
      else if (f.kind === "bud")    drawBud(f.x, f.y, f.r, f.rot);
      else                          drawPetal(f.x, f.y, f.r, f.rot);
    });
  }

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    generateFlowers(canvas.width, canvas.height);
    draw();
  }

  resize();
  window.addEventListener("resize", resize);
})();
</script>

      footerEl.innerHTML = "";
      footerEl.classList.add("section-hidden");
    }

    backdrop.classList.add("open");
    backdrop.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    const backdrop = $("modalBackdrop");
    if (!backdrop) return;
    backdrop.classList.remove("open");
    backdrop.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  function wireModalEvents() {
    const backdrop = $("modalBackdrop");
    const closeBtn = $("modalCloseBtn");
    if (closeBtn) closeBtn.onclick = closeModal;
    if (backdrop) {
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal();
      });
    }
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  }

  async function getSession() {
    const { data } = await supabase.auth.getSession();

  async function ensureProfile(user) {
    try {
      const { data: existing, error } = await supabase
        .from("profiles")
        .select("id, display_name")
        .eq("id", user.id)
        .maybeSingle();

      if (error && error.code !== "PGRST116") {
        console.warn("profiles select error:", error);
      }

      if (existing && existing.id) {
        profileName = existing.display_name || guessName(user) || "멤버";
        return;
      }

      const guess = guessName(user) || "멤버";
      const { error: insErr } = await supabase
        .from("profiles")
        .insert({ id: user.id, display_name: guess });
      if (insErr) {
        console.warn("profiles insert error:", insErr);
      }
      profileName = guess;
    } catch (e) {
      console.warn("ensureProfile exception:", e);
      profileName = guessName(user) || "멤버";
    }
  }

  function guessName(user) {
    const md = user?.user_metadata || {};
    const candidates = [
      md.full_name, md.name, md.nickname, md.preferred_username,
      md.user_name, md.display_name
    ].filter(Boolean);
    if (candidates.length > 0) return String(candidates[0]);
    return "";
  }

  async function checkAdmin(user) {
    isAdmin = false;
    try {
      const { data, error } = await supabase
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        console.warn("admin_users check error:", error);
        isAdmin = false;
        return;
      }
      isAdmin = !!(data && data.user_id);
    } catch (e) {
      console.warn("checkAdmin exception:", e);
      isAdmin = false;
    }
  }

  async function loadClubSettings() {
    currentBooks = [DEFAULT_BOOK_TITLE];
    currentSeason = null;
    try {
      const { data, error } = await supabase
        .from("club_settings")
        .select("key, value");

      if (!error && data) {
        data.forEach(row => {
          // 새로운 형식: current_books (배열)
          if (row.key === "current_books" && row.value && Array.isArray(row.value.titles)) {
            currentBooks = row.value.titles.filter(t => t && t.trim());
            if (currentBooks.length === 0) currentBooks = [DEFAULT_BOOK_TITLE];
          }
          // 하위 호환: current_book (단일)
          if (row.key === "current_book" && row.value && row.value.title) {
            // current_books가 없을 때만 적용
            if (currentBooks.length === 1 && currentBooks[0] === DEFAULT_BOOK_TITLE) {
              currentBooks = [row.value.title];
            }
          }
          if (row.key === "season" && row.value) {
            currentSeason = row.value;
          }
        });
      }
    } catch (e) {
      console.warn("loadClubSettings exception:", e);
    }

    // 선택된 책이 목록에 없으면 첫 번째 책으로 설정
    if (!currentBooks.includes(selectedBookTitle)) {
      selectedBookTitle = currentBooks[0];
    }

    const header = $("headerBookLabel");
    if (header) {
      const seasonTxt = currentSeason?.name ? ` · ${currentSeason.name}` : "";
      header.textContent = `Daily Reading${seasonTxt}`;
    }
  }

  async function saveBio(user) {
    const ta = $("bioInput");
    const statusEl = $("bioStatus");
    if (!user || !ta) return;
    const bioText = ta.value.trim();
    const { error } = await supabase
      .from("profiles")
      .update({ bio: bioText || null })
      .eq("id", user.id);
    if (error) {
      console.error("자기소개 저장 오류:", error);
      if (statusEl) statusEl.textContent = "저장 중 오류가 발생했습니다.";

    if (statusEl) statusEl.textContent = "자기소개가 저장되었습니다.";
    // 대시보드 갱신
    if (document.querySelector('.tab[data-tab="dashboard"]')?.classList.contains("active")) {
      await loadDashboard();
    }
  }

  async function saveNickname(user) {
    const input = $("nicknameInput");
    const statusEl = $("nicknameStatus");
    const headerName = $("headerDisplayName");
    const newName = (input && input.value ? input.value : "").trim();
    if (!user) return;
    if (!newName) {
      if (statusEl) statusEl.textContent = "닉네임을 입력해 주세요.";
      return;
    }
    const { error } = await supabase
      .from("profiles")
      .upsert({ id: user.id, display_name: newName }, { onConflict: "id" });
    if (error) {
      console.error("닉네임 저장 오류:", error);
      if (statusEl) statusEl.textContent = "닉네임 저장 중 오류가 발생했습니다.";
      return;
    }
    profileName = newName;
    if (statusEl) statusEl.textContent = "닉네임이 저장되었습니다.";
    if (headerName) headerName.textContent = newName;
    await loadClubLogs(true);
    await loadDashboard();
  }

  // ====== DATA: LOG LISTS (SERVER FILTER) ======
  function applyLogQuery(base, { search, start, end, onlyMine, bookTitle, bookFilter, seasonId, useCurrentSeason = true, limit = 50, offset = 0 }) {
    let q = base
      .eq("archived", false)
      .order("date", { ascending: false })
      .range(offset, offset + limit - 1);

    // 책 필터링
    if (bookTitle) {
      // 특정 책 지정 (아카이브용)
      q = q.eq("book_title", bookTitle);
    } else if (bookFilter) {
      // 필터에서 특정 책 선택
      q = q.eq("book_title", bookFilter);
    } else if (currentBooks.length > 0) {
      // 현재 시즌의 모든 책
      q = q.in("book_title", currentBooks);
    }

    if (onlyMine) q = q.eq("user_id", sessionUser.id);

    // 시즌 필터링
    if (useCurrentSeason && seasonIdOrNull()) {
      q = q.eq("season_id", seasonIdOrNull());
    } else if (seasonId !== undefined) {
      if (seasonId === null || seasonId === "") {
        q = q.is("season_id", null);
      } else {
        q = q.eq("season_id", seasonId);
      }
    }

    if (start) q = q.gte("date", start);
    if (end) q = q.lte("date", end);

    if (search) {
      const s = search.replaceAll('"','\"');
      q = q.or(`section.ilike.%${s}%,key_points.ilike.%${s}%,quote.ilike.%${s}%,reflection.ilike.%${s}%`);
    }
    return q;
  }

  function renderLogCard(row, opts={}) {
    const div = document.createElement("div");
    div.className = "log-item";

    const nameMap = opts.nameMap || {};
    const rankMap = opts.rankMap || {};
    const who = (row.user_id === sessionUser.id) ? "나" : (nameMap[row.user_id] || "멤버");
    const showBookTitle = currentBooks.length > 1 || opts.isArchive;
    const bookLabel = showBookTitle ? ` · ${row.book_title}` : "";
    const headLeft = `${formatDate(row.date)} · ${who}${bookLabel}`;
    const section = row.section || "범위 미기입";
    const keypoints = row.key_points || "";
    const isArchive = opts.isArchive || false;
    const canEdit = row.user_id === sessionUser.id && !isArchive;

    // 등급 뱃지 (클럽 기록에서만 표시, 본인 제외)
    const rank = rankMap[row.user_id];
    const rankBadgeHtml = (rank && row.user_id !== sessionUser.id)
      ? `<span class="rank-badge ${rank.cssClass} log-rank">${rank.emoji} ${rank.name}</span>`
      : "";

    const preview = keypoints || row.quote || "";
    const previewHtml = safeHtmlWithBreaks(preview);

    // 댓글 수
    const commentCountMap = opts.commentCountMap || {};
    const cCount = commentCountMap[row.id] || 0;
    const commentChipHtml = !isArchive
      ? `<span class="comment-count-chip${cCount > 0 ? " has-comments" : ""}">💬 ${cCount}</span>`
      : "";

    div.innerHTML = `
      <div class="log-head">
        <span>${escapeHtml(headLeft)}${rankBadgeHtml}${canEdit ? ` <a href="#" class="edit-link" data-act="edit">수정</a>` : ''}</span>
        <span style="display:inline-flex;align-items:center;gap:.35rem;">
          ${commentChipHtml}
          <span class="pill${isArchive ? ' archive' : ''}">${escapeHtml(section)}</span>
        </span>
      </div>

    `;

    div.querySelector('[data-act="details"]').onclick = () => openLogDetails(row);
    const editLink = div.querySelector('[data-act="edit"]');
    if (editLink) {
      editLink.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();

      };

    return div;
  }

  // ====== RANK SYSTEM ======

  const RANKS = [
    {
      key: "legend", emoji: "👑", name: "레전드",
      cssClass: "rank-legend",
      desc: "전설적인 독서가",
      cond: { logs: 100, comments: 50, days: 30 }
    },
    {
      key: "master", emoji: "⭐", name: "북마스터",
      cssClass: "rank-master",
      desc: "독서의 달인",
      cond: { logs: 50, comments: 20, days: 0 }
    },
    {
      key: "hot", emoji: "🔥", name: "열독자",
      cssClass: "rank-hot",
      desc: "꾸준한 독서 습관의 소유자",
      cond: { logs: 20, comments: 5, days: 0 }
    },
    {
      key: "reader", emoji: "📖", name: "독서가",
      cssClass: "rank-reader",
      desc: "독서를 즐기는 멤버",
      cond: { logs: 5, comments: 0, days: 0 }
    },
    {
      key: "seed", emoji: "🌱", name: "새싹",
      cssClass: "rank-seed",

      cond: { logs: 0, comments: 0, days: 0 }
    }
  ];

  // 다음 등급까지의 진행률 계산
  function calcRank(logs, comments, activeDays) {
    for (let i = 0; i < RANKS.length; i++) {
      const r = RANKS[i];
      const c = r.cond;
      if (logs >= c.logs && comments >= c.comments && activeDays >= c.days) {
        const current = r;
        const next = RANKS[i - 1] || null; // 상위 등급
        let progress = 100;
        let progressLabel = "";
        if (next) {
          const nc = next.cond;
          // 로그, 댓글, 일수 중 가장 낮은 달성률
          const rates = [];
          if (nc.logs > 0)     rates.push(Math.min(logs / nc.logs, 1));
          if (nc.comments > 0) rates.push(Math.min(comments / nc.comments, 1));
          if (nc.days > 0)     rates.push(Math.min(activeDays / nc.days, 1));
          progress = rates.length ? Math.round(Math.min(...rates) * 100) : 100;
          progressLabel = `다음 등급 ${next.emoji} ${next.name}까지 ${progress}%`;
        } else {
          progressLabel = "최고 등급 달성! 🎉";
        }
        return { current, next, progress, progressLabel };
      }
    }
    return { current: RANKS[RANKS.length - 1], next: RANKS[RANKS.length - 2], progress: 0, progressLabel: "" };
  }

  // 유저 활동 통계 조회
  async function fetchUserStats(userId) {
    const [logsRes, commentsRes] = await Promise.all([
      supabase.from("reading_logs").select("date", { count: "exact" }).eq("user_id", userId).eq("archived", false),
      supabase.from("comments").select("id",       { count: "exact" }).eq("user_id", userId)
    ]);

    const logCount     = logsRes.count || 0;
    const commentCount = commentsRes.count || 0;

    // 활동 기간 = 첫 기록일부터 오늘까지 일수
    let activeDays = 0;
    if (logsRes.data && logsRes.data.length > 0) {
      const dates = logsRes.data.map(r => new Date(r.date)).sort((a, b) => a - b);
      const first = dates[0];
      const today = new Date();
      activeDays = Math.floor((today - first) / (1000 * 60 * 60 * 24));
    }

    return { logCount, commentCount, activeDays };
  }

  // 프로필 탭 — 내 등급 로드 및 렌더링 (rank_override 반영)
  async function loadMyRank() {
    const el = $("rankCard");
    if (!el) return;
    el.innerHTML = `<div class="muted">등급 불러오는 중...</div>`;

    const { logCount, commentCount, activeDays } = await fetchUserStats(sessionUser.id);

    // rank_override 확인
    const { data: prof } = await supabase.from("profiles").select("rank_override").eq("id", sessionUser.id).maybeSingle();
    const rankOverride = prof?.rank_override || null;

    let current, next, progress, progressLabel;
    if (rankOverride) {
      current = RANKS.find(r => r.key === rankOverride) || RANKS[RANKS.length - 1];
      next = null; progress = 100; progressLabel = "관리자 지정 등급";
    } else {
      ({ current, next, progress, progressLabel } = calcRank(logCount, commentCount, activeDays));
    }

    el.innerHTML = `
      <div class="rank-card-title">나의 독서 등급</div>
      <div class="rank-main">
        <div class="rank-emoji">${current.emoji}</div>
        <div>
          <div class="rank-info-name">
            <span class="rank-badge ${current.cssClass}">${current.emoji} ${current.name}</span>
          </div>

        </div>
      </div>
      <div class="rank-stats">
        <div class="rank-stat">
          <div class="rank-stat-val">${logCount}</div>
          <div class="rank-stat-lbl">📝 기록 수</div>
        </div>
        <div class="rank-stat">
          <div class="rank-stat-val">${commentCount}</div>
          <div class="rank-stat-lbl">💬 댓글 수</div>
        </div>
        <div class="rank-stat">
          <div class="rank-stat-val">${activeDays}</div>
          <div class="rank-stat-lbl">📅 활동 일수</div>
        </div>
      </div>
      ${next ? `
      <div class="rank-progress-wrap">
        <div class="rank-progress-label">
          <span>${progressLabel}</span>
          <span>${progress}%</span>
        </div>
        <div class="rank-progress-bar">

        </div>
      </div>` : `<div class="muted" style="font-size:.8rem;text-align:center;">${progressLabel}</div>`}
    `;
  }

  // 전체 멤버 등급 맵 (클럽 기록 카드에 표시용) — rank_override 반영
  async function loadRankMap() {
    const map = {};
    try {
      const { data: profiles } = await supabase.from("profiles").select("id, rank_override");
      if (!profiles) return map;

      await Promise.all(profiles.map(async (p) => {
        if (p.rank_override) {
          // 수동 지정 등급 우선
          const overrideRankObj = RANKS.find(r => r.key === p.rank_override);
          map[p.id] = overrideRankObj || RANKS[RANKS.length - 1];
        } else {
          const stats = await fetchUserStats(p.id);
          const { current } = calcRank(stats.logCount, stats.commentCount, stats.activeDays);
          map[p.id] = current;
        }
      }));
    } catch (e) { console.warn("loadRankMap error:", e); }
    return map;
  }

  function showToast({ title, body, onClick }) {
    const container = document.getElementById("toastContainer");
    if (!container) return;

    const el = document.createElement("div");
    el.className = "toast-item";
    el.innerHTML = `
      <div class="toast-title">${escapeHtml(title)}</div>
      ${body ? `<div class="toast-body">${escapeHtml(body)}</div>` : ""}
    `;
    if (onClick) el.onclick = onClick;

    container.appendChild(el);
    // 애니메이션 트리거
    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.add("show"));
    });

    // 5초 후 자동 제거
    setTimeout(() => {
      el.classList.remove("show");
      setTimeout(() => el.remove(), 300);
    }, 5000);
  }

      banner.onclick = (e) => {

  // 부팅 시 미확인 댓글 조회
  async function checkUnreadComments() {
    if (!sessionUser) return;
    loadLastSeenAt();

    try {
      // 내 기록 ID 목록 조회
      const { data: myLogs, error: logsErr } = await supabase
        .from("reading_logs")
        .select("id")
        .eq("user_id", sessionUser.id);

      if (logsErr || !myLogs || myLogs.length === 0) return;

      const myLogIds = myLogs.map(r => r.id);

      // 내 기록에 달린 댓글 중, 본인이 쓴 댓글 제외, lastSeenAt 이후 것만
      let q = supabase
        .from("comments")
        .select("id", { count: "exact", head: true })
        .in("log_id", myLogIds)
        .neq("user_id", sessionUser.id);

      if (lastSeenAt) {
        q = q.gt("created_at", lastSeenAt);
      }

      const { count, error } = await q;
      if (error) { console.warn("checkUnreadComments error:", error); return; }

      updateUnreadBanner(count || 0);
    } catch (e) {
      console.warn("checkUnreadComments exception:", e);
    }
  }

  // Realtime 구독 — 앱 열려있는 동안 실시간 토스트
  async function subscribeComments() {
    if (commentSubscription) {
      supabase.removeChannel(commentSubscription);
      commentSubscription = null;
    }

    // 내 기록 ID 목록 조회
    const { data: myLogs } = await supabase
      .from("reading_logs")
      .select("id")
      .eq("user_id", sessionUser.id);

    const myLogIds = new Set((myLogs || []).map(r => r.id));
    if (myLogIds.size === 0) return;

    const nameMap = await loadProfilesMap();

    commentSubscription = supabase
      .channel("comments-realtime")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "comments" },
        (payload) => {
          const c = payload.new;
          // 내 기록에 달린 댓글이고, 내가 쓴 것이 아닐 때만
          if (!myLogIds.has(c.log_id)) return;
          if (c.user_id === sessionUser.id) return;

          const authorName = nameMap[c.user_id] || "멤버";
          const preview = (c.content || "").slice(0, 50);

          showToast({
            title: `💬 ${authorName}님이 댓글을 달았어요`,
            body: preview,
            onClick: () => {
              // 해당 기록 모달 열기
              openLogDetails(c.log_id);
              saveLastSeenAt();
              updateUnreadBanner(0);
            }
          });

          // 배너도 +1 업데이트
          const banner = document.getElementById("unreadBanner");
          const text   = document.getElementById("unreadBannerText");
          if (banner && text) {
            const cur = parseInt(text.dataset.count || "0") + 1;
            text.dataset.count = cur;
            text.textContent = `내 기록에 새 댓글이 ${cur}개 있어요`;
            banner.style.display = "flex";
          }
        }
      )
      .subscribe();
  }

  function unsubscribeComments() {

  // ====== COMMENTS ======
  async function loadComments(logId) {
    const listEl = document.getElementById(`commentList-${logId}`);
    if (!listEl) return;
    listEl.innerHTML = `<div class="comment-empty">불러오는 중...</div>`;

    const nameMap = await loadProfilesMap();

    const { data, error } = await supabase
      .from("comments")
      .select("*")
      .eq("log_id", logId)
      .order("created_at", { ascending: true });

    if (error) {
      console.error("loadComments error:", error);
      listEl.innerHTML = `<div class="comment-empty">댓글을 불러오지 못했습니다.</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = `<div class="comment-empty">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>`;
      return;
    }

    listEl.innerHTML = "";
    data.forEach(c => {
      const isMine = c.user_id === sessionUser.id;
      const authorName = escapeHtml(nameMap[c.user_id] || "멤버");
      const timeStr = new Date(c.created_at).toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
      const div = document.createElement("div");
      div.className = "comment-item";
      div.innerHTML = `
        <div class="comment-meta">
          <span class="comment-author">${authorName}</span>
          <span>${timeStr}</span>
          ${isMine ? `<button class="comment-delete-btn" data-cid="${c.id}" title="삭제">✕ 삭제</button>` : ""}
        </div>
        <div class="comment-body">${safeHtmlWithBreaks(c.content)}</div>
      `;
      if (isMine) {
        div.querySelector(".comment-delete-btn").onclick = () => deleteComment(c.id, logId);
      }
      listEl.appendChild(div);
    });
  }

  async function submitComment(logId) {
    const textarea = document.getElementById(`commentInput-${logId}`);
    const btn = document.getElementById(`commentSubmit-${logId}`);
    const content = (textarea?.value || "").trim();
    if (!content) return;

    btn.disabled = true;
    btn.textContent = "저장 중...";

    const { error } = await supabase.from("comments").insert({
      log_id: logId,
      user_id: sessionUser.id,
      content
    });

    btn.disabled = false;
    btn.textContent = "등록";

    if (error) {
      console.error("submitComment error:", error);
      alert("댓글 저장에 실패했습니다.");
      return;
    }
    textarea.value = "";
    await loadComments(logId);
  }

  async function deleteComment(commentId, logId) {
    if (!confirm("댓글을 삭제하시겠습니까?")) return;
    const { error } = await supabase.from("comments").delete().eq("id", commentId).eq("user_id", sessionUser.id);
    if (error) {
      console.error("deleteComment error:", error);
      alert("삭제에 실패했습니다.");
      return;
    }
    await loadComments(logId);
  }

  // ====== ARCHIVE ======
  async function loadArchivedBooks() {
    const selectEl = $("archiveSelect");
    if (!selectEl) return;

    selectEl.innerHTML = `<option value="">불러오는 중...</option>`;

    try {
      // 비활성 or 정지 멤버는 자기 기록만 기준으로 아카이브 목록 표시
      let q = supabase.from("reading_logs").select("book_title, season_id, created_at").eq("archived", false);
      if (!mySeasonActive || mySuspendedAt) q = q.eq("user_id", sessionUser.id);
      if (mySuspendedAt) q = q.lt("created_at", mySuspendedAt);
      const { data, error } = await q;

      if (error) {
        console.error("loadArchivedBooks error:", error);
        selectEl.innerHTML = `<option value="">불러오기 실패</option>`;
        return;
      }

      // 고유 조합 추출 (현재 시즌의 책들 제외)
      const uniqueMap = new Map();
      data.forEach(row => {
        const key = `${row.book_title}|||${row.season_id || ""}`;
        // 현재 시즌의 책들은 제외
        const isCurrentSeason = row.season_id === seasonIdOrNull() || (!row.season_id && !seasonIdOrNull());
        const isCurrentBook = currentBooks.includes(row.book_title);
        const isCurrent = isCurrentSeason && isCurrentBook;
        if (!isCurrent) {
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, { book_title: row.book_title, season_id: row.season_id, count: 0 });
          }
          uniqueMap.get(key).count++;
        }
      });

      archivedBooks = Array.from(uniqueMap.values());

      // 드롭다운 옵션 생성
      if (archivedBooks.length === 0) {
        selectEl.innerHTML = `<option value="">아카이브된 기록이 없습니다</option>`;
        return;
      }

      selectEl.innerHTML = `<option value="">-- 선택하세요 --</option>`;
      archivedBooks.forEach(item => {
        const opt = document.createElement("option");
        opt.value = `${item.book_title}|||${item.season_id || ""}`;
        const seasonLabel = item.season_id ? ` (시즌: ${item.season_id.substring(0,8)}...)` : " (시즌 없음)";
        opt.textContent = `${item.book_title}${seasonLabel} - ${item.count}개 기록`;
        selectEl.appendChild(opt);
      });

    } catch (e) {
      console.error("loadArchivedBooks exception:", e);
      selectEl.innerHTML = `<option value="">불러오기 실패</option>`;
    }
  }

  // 아카이브 초기 로드 (새로 선택하거나 검색할 때)
  async function loadArchiveLogs(reset = true) {
    const listEl = $("archiveLogsList");
    if (!listEl || !selectedArchive) return;

    if (reset) {
      archiveOffset = 0;
      archiveHasMore = true;
      archiveLogs = [];
      listEl.innerHTML = `<div class="muted">불러오는 중...</div>`;
    }

    if (archiveLoading || !archiveHasMore) return;
    archiveLoading = true;

    const nameMap = await loadProfilesMap();

    // 비활성 or 정지 멤버: 자기 기록만 볼 수 있음
    const onlyMine = !mySeasonActive || !!mySuspendedAt;

    let baseQuery = supabase.from("reading_logs").select("*");
    // 정지된 멤버: 정지 시각 이전 기록만
    if (mySuspendedAt) {
      baseQuery = baseQuery.lt("created_at", mySuspendedAt);
    }

    const { data, error } = await applyLogQuery(baseQuery, {
      search: "",
      onlyMine,
      bookTitle: selectedArchive.book_title,
      seasonId: selectedArchive.season_id,
      useCurrentSeason: false,
      limit: ARCHIVE_PAGE_SIZE,
      offset: archiveOffset
    });

    archiveLoading = false;

    if (error) {
      console.error("loadArchiveLogs error:", error);
      if (reset) listEl.innerHTML = `<div class="muted">기록을 불러오지 못했습니다.</div>`;
      return;
    }

    if (!data || data.length === 0) {
      archiveHasMore = false;
      if (reset) {
        listEl.innerHTML = `<div class="muted">표시할 기록이 없습니다.</div>`;
      } else {
        // 더 이상 데이터 없음 - 로딩 인디케이터 제거
        const loader = $("archiveLoader");
        if (loader) loader.remove();
      }
      return;
    }

    // 다음 페이지가 있는지 확인
    if (data.length < ARCHIVE_PAGE_SIZE) {
      archiveHasMore = false;
    }

    archiveOffset += data.length;
    archiveLogs = archiveLogs.concat(data);

    // 클라이언트 사이드 필터링 (검색어가 있을 때)
    const search = ($("archiveSearch")?.value || "").trim().toLowerCase();
    let displayLogs = archiveLogs;
    if (search) {
      displayLogs = archiveLogs.filter(row => {
        const authorName = (nameMap[row.user_id] || "").toLowerCase();
        const section = (row.section || "").toLowerCase();
        const keyPoints = (row.key_points || "").toLowerCase();
        const quote = (row.quote || "").toLowerCase();
        const reflection = (row.reflection || "").toLowerCase();

        return authorName.includes(search) ||
               section.includes(search) ||
               keyPoints.includes(search) ||
               quote.includes(search) ||
               reflection.includes(search);
      });
    }

    if (displayLogs.length === 0 && reset) {
      listEl.innerHTML = `<div class="muted">검색 결과가 없습니다.</div>`;
      return;
    }

    // 리스트 렌더링
    listEl.innerHTML = "";
    displayLogs.forEach(row => listEl.appendChild(renderLogCard(row, { scope: "club", nameMap, isArchive: true })));

    // 더 불러올 데이터가 있으면 로딩 인디케이터 추가
    if (archiveHasMore) {
      const loader = document.createElement("div");
      loader.id = "archiveLoader";
      loader.className = "muted";
      loader.style.textAlign = "center";
      loader.style.padding = "1rem";
      loader.textContent = "스크롤하여 더 보기...";
      listEl.appendChild(loader);
    }
  }

  // 아카이브 스크롤 이벤트 핸들러
  function setupArchiveScroll() {
    const listEl = $("archiveLogsList");
    if (!listEl) return;

    window.addEventListener("scroll", () => {
      if (!selectedArchive || archiveLoading || !archiveHasMore) return;

      const loader = $("archiveLoader");
      if (!loader) return;

      const rect = loader.getBoundingClientRect();
      const isVisible = rect.top < window.innerHeight + 100;

      if (isVisible) {
        loadArchiveLogs(false); // 추가 로드
      }
    }, { passive: true });
  }

  // ====== DASHBOARD ======
  async function loadDashboard() {
    const container = $("dashboardContent");
    if (!container) return;
    container.textContent = "데이터를 불러오는 중...";

    try {
      const nameMap = await loadProfilesMap();

      let q = supabase.from("reading_logs")
        .select("user_id,date,book_title")
        .in("book_title", currentBooks)
        .eq("archived", false)
        .order("date", { ascending: false })
        .limit(1000);

      if (seasonIdOrNull()) q = q.eq("season_id", seasonIdOrNull());

      const { data, error } = await q;
      if (error) {
        console.error("dashboard logs error:", error);
        container.textContent = "대시보드 데이터를 불러오지 못했습니다.";
        return;
      }
      if (!data || data.length === 0) {
        container.textContent = "아직 기록된 데이터가 없습니다.";
        return;
      }

      const todayStr = todayISO();
      const todayDate = new Date(todayStr);
      const sevenAgo = new Date(todayDate.getTime() - 6*24*60*60*1000);

      const todayUsers = new Set();
      const last7Users = new Set();
      const allUsers = new Set();
      const counts = {};
      const bookCounts = {};

      data.forEach(r => {
        const uid = r.user_id;
        if (!uid) return;
        allUsers.add(uid);
        counts[uid] = (counts[uid] || 0) + 1;
        bookCounts[r.book_title] = (bookCounts[r.book_title] || 0) + 1;
        if (r.date === todayStr) todayUsers.add(uid);
        const d = new Date(r.date);
        if (d >= sevenAgo && d <= todayDate) last7Users.add(uid);
      });

      const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([uid,c])=>({ uid, name: nameMap[uid] || "멤버", c }));

      // 책별 기록 수
      const bookStats = currentBooks.map(b => ({
        title: b,
        count: bookCounts[b] || 0
      }));

      container.innerHTML = `
        <div class="logs-list" style="gap:.45rem;">
          <div class="log-item"><div class="log-head"><span>오늘 기록한 멤버</span><span class="pill">${todayUsers.size}</span></div></div>
          <div class="log-item"><div class="log-head"><span>최근 7일 기록한 멤버</span><span class="pill">${last7Users.size}</span></div></div>
          <div class="log-item"><div class="log-head"><span>총 기록 수</span><span class="pill">${data.length}</span></div></div>
          <div class="log-item"><div class="log-head"><span>참여 멤버 수</span><span class="pill">${allUsers.size}</span></div></div>
        </div>
        ${currentBooks.length > 1 ? `
        <div style="margin-top:.8rem;">
          <div class="subtitle" style="margin-bottom:.35rem;">책별 기록 수</div>
          <div class="logs-list" style="gap:.35rem;">
            ${bookStats.map(b => `<div class="log-item"><div class="log-head"><span>${escapeHtml(b.title)}</span><span class="pill">${b.count}</span></div></div>`).join('')}
          </div>
        </div>
        ` : ''}
        <div style="margin-top:.8rem;">
          <div class="subtitle" style="margin-bottom:.35rem;">가장 활발한 멤버</div>
          ${top.length ? `<ul class="mini-list">${top.map(x=>`<li>${escapeHtml(x.name)} – ${x.c}회</li>`).join("")}</ul>` : `<div class="muted">데이터가 충분하지 않습니다.</div>`}
        </div>
      `;

      // 멤버 소개 카드
      await loadMemberBios(nameMap);
    } catch (e) {
      console.error("loadDashboard exception:", e);
      container.textContent = "대시보드 데이터를 불러오지 못했습니다.";
    }
  }

  async function loadMemberBios(nameMap) {
    const bioSection = $("memberBioSection");
    if (!bioSection) return;

    // 1) bio 있는 멤버 조회
    const { data: profiles, error } = await supabase
      .from("profiles")
      .select("id, display_name, bio")
      .not("bio", "is", null)
      .neq("bio", "")
      .order("display_name");

    if (error || !profiles || profiles.length === 0) {
      bioSection.innerHTML = "";
      return;
    }

    const targetIds = profiles.map(p => p.id);

    // 2) 좋아요 & 댓글 수 배치 조회 (병렬)
    const [likesRes, commentsRes, myLikesRes] = await Promise.all([
      supabase.from("bio_likes")
        .select("target_user_id")
        .in("target_user_id", targetIds),
      supabase.from("bio_comments")
        .select("target_user_id")
        .in("target_user_id", targetIds),
      sessionUser
        ? supabase.from("bio_likes")
            .select("target_user_id")
            .eq("user_id", sessionUser.id)
            .in("target_user_id", targetIds)
        : Promise.resolve({ data: [] })
    ]);

    // 집계
    const likeCountMap = {};
    const commentCountMap = {};
    const myLikedSet = new Set();

    (likesRes.data || []).forEach(r => {
      likeCountMap[r.target_user_id] = (likeCountMap[r.target_user_id] || 0) + 1;
    });
    (commentsRes.data || []).forEach(r => {
      commentCountMap[r.target_user_id] = (commentCountMap[r.target_user_id] || 0) + 1;
    });
    (myLikesRes.data || []).forEach(r => myLikedSet.add(r.target_user_id));

    // 3) 섹션 헤더 + 그리드 컨테이너
    bioSection.innerHTML = `
      <div class="subtitle" style="margin-bottom:.6rem;font-weight:600;">멤버 소개</div>
      <div class="bio-cards-grid" id="bioCardsGrid"></div>
    `;
    const grid = $("bioCardsGrid");

    // 4) 카드 렌더링
    profiles.forEach(p => {
      const tid = p.id;
      const isMine = sessionUser?.id === tid;
      const likeCount = likeCountMap[tid] || 0;
      const commentCount = commentCountMap[tid] || 0;
      const liked = myLikedSet.has(tid);

      const card = document.createElement("div");
      card.className = "bio-card";
      card.dataset.tid = tid;
      card.innerHTML = `
        <div class="bio-card-name">${escapeHtml(p.display_name || "멤버")}</div>
        <div class="bio-card-text">${escapeHtml(p.bio).replace(/\n/g, "<br>")}</div>
        <div class="bio-card-actions">
          <button class="bio-like-btn${liked ? " liked" : ""}" data-tid="${tid}">
            ${liked ? "❤️" : "🤍"} <span class="bio-like-count">${likeCount}</span>
          </button>
          <button class="bio-comment-toggle" data-tid="${tid}">
            💬 <span class="bio-cmt-count">${commentCount}</span>
          </button>
        </div>
        <div class="bio-comment-area" id="bioCommentArea-${tid}">
          <div class="bio-comment-list" id="bioCommentList-${tid}">
            <div class="comment-empty">불러오는 중...</div>
          </div>
          <div class="bio-comment-form">
            <textarea id="bioCmtInput-${tid}" placeholder="댓글을 입력하세요… (Ctrl+Enter로 등록)" rows="2"></textarea>
            <button class="bio-comment-submit" id="bioCmtSubmit-${tid}">등록</button>
          </div>
        </div>
      `;

      // 좋아요 토글 (본인 bio는 좋아요 불가)
      const likeBtn = card.querySelector(".bio-like-btn");
      if (isMine) {
        likeBtn.disabled = true;
        likeBtn.title = "내 소개에는 좋아요를 누를 수 없어요";
        likeBtn.style.opacity = ".45";
        likeBtn.style.cursor = "default";
      } else {
        likeBtn.onclick = () => toggleBioLike(tid, card);
      }

      // 댓글 토글
      const commentToggle = card.querySelector(".bio-comment-toggle");
      const commentArea = card.querySelector(`#bioCommentArea-${tid}`);
      commentToggle.onclick = () => {
        const isOpen = commentArea.classList.toggle("open");
        commentToggle.classList.toggle("open", isOpen);
        if (isOpen) loadBioComments(tid);
      };

      // 댓글 등록 버튼
      const submitBtn = card.querySelector(`#bioCmtSubmit-${tid}`);
      const textarea  = card.querySelector(`#bioCmtInput-${tid}`);
      submitBtn.onclick = () => submitBioComment(tid, card);
      textarea.addEventListener("keydown", e => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          submitBioComment(tid, card);
        }
      });

      grid.appendChild(card);
    });
  }

  // ─── 좋아요 토글 ───
  async function toggleBioLike(tid, card) {
    const likeBtn   = card.querySelector(".bio-like-btn");
    const likeCount = card.querySelector(".bio-like-count");
    const isLiked   = likeBtn.classList.contains("liked");

    likeBtn.disabled = true;

    if (isLiked) {
      const { error } = await supabase.from("bio_likes")
        .delete()
        .eq("user_id", sessionUser.id)
        .eq("target_user_id", tid);
      if (!error) {
        likeBtn.classList.remove("liked");
        likeBtn.innerHTML = `🤍 <span class="bio-like-count">${Math.max(0, parseInt(likeCount.textContent) - 1)}</span>`;
      }
    } else {
      const { error } = await supabase.from("bio_likes")
        .insert({ user_id: sessionUser.id, target_user_id: tid });
      if (!error) {
        likeBtn.classList.add("liked");
        likeBtn.innerHTML = `❤️ <span class="bio-like-count">${parseInt(likeCount.textContent) + 1}</span>`;
      }
    }
    likeBtn.disabled = false;
  }

  // ─── 댓글 로드 ───
  async function loadBioComments(tid) {
    const listEl = $(`bioCommentList-${tid}`);
    if (!listEl) return;
    listEl.innerHTML = `<div class="comment-empty">불러오는 중...</div>`;

    const nameMap = await loadProfilesMap();
    const { data, error } = await supabase
      .from("bio_comments")
      .select("*")
      .eq("target_user_id", tid)
      .order("created_at", { ascending: true });

    if (error) { listEl.innerHTML = `<div class="comment-empty">댓글을 불러오지 못했습니다.</div>`; return; }
    if (!data || data.length === 0) {
      listEl.innerHTML = `<div class="comment-empty">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>`;
      return;
    }

    listEl.innerHTML = "";
    data.forEach(c => {
      const isMine = c.user_id === sessionUser?.id;
      const authorName = escapeHtml(nameMap[c.user_id] || "멤버");
      const timeStr = new Date(c.created_at).toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
      const div = document.createElement("div");
      div.className = "bio-comment-item";
      div.innerHTML = `
        <div class="bio-comment-meta">
          <span class="bio-comment-author">${authorName}</span>
          <span>${timeStr}</span>
          ${isMine ? `<button class="bio-comment-del" data-cid="${c.id}" data-tid="${tid}">✕ 삭제</button>` : ""}
        </div>
        <div class="bio-comment-body">${safeHtmlWithBreaks(c.content)}</div>
      `;
      if (isMine) {
        div.querySelector(".bio-comment-del").onclick = (e) => {
          const { cid, tid: t } = e.currentTarget.dataset;
          deleteBioComment(cid, t);
        };
      }
      listEl.appendChild(div);
    });
  }

  // ─── 댓글 등록 ───
  async function submitBioComment(tid, card) {
    const textarea  = card.querySelector(`#bioCmtInput-${tid}`);
    const submitBtn = card.querySelector(`#bioCmtSubmit-${tid}`);
    const content = (textarea?.value || "").trim();
    if (!content) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "저장 중...";

    const { error } = await supabase.from("bio_comments").insert({
      user_id: sessionUser.id,
      target_user_id: tid,
      content
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "등록";

    if (error) { alert("댓글 저장에 실패했습니다."); return; }

    textarea.value = "";
    // 댓글 수 카운터 업데이트
    const countEl = card.querySelector(".bio-cmt-count");
    if (countEl) countEl.textContent = parseInt(countEl.textContent) + 1;
    await loadBioComments(tid);
  }

  // ─── 댓글 삭제 ───
  async function deleteBioComment(commentId, tid) {
    if (!confirm("댓글을 삭제하시겠습니까?")) return;
    const { error } = await supabase.from("bio_comments")
      .delete()
      .eq("id", commentId)
      .eq("user_id", sessionUser.id);
    if (error) { alert("삭제에 실패했습니다."); return; }

    // 카운터 업데이트
    const card = document.querySelector(`.bio-card[data-tid="${tid}"]`);
    if (card) {
      const countEl = card.querySelector(".bio-cmt-count");
      if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
    }
    await loadBioComments(tid);
  }

  // ====== ADMIN ======
  function fillAdminForms() {
    $("settingSeasonIdInput").value = currentSeason?.id || "";
    $("settingSeasonNameInput").value = currentSeason?.name || "";
    $("settingSeasonStartInput").value = currentSeason?.start || "";
    $("settingSeasonEndInput").value = currentSeason?.end || "";
  }

  function renderCurrentBooksList() {
    const listEl = $("currentBooksList");
    if (!listEl) return;

    if (currentBooks.length === 0) {
      listEl.innerHTML = `<div class="muted">등록된 책이 없습니다.</div>`;
      return;
    }

    listEl.innerHTML = "";
    currentBooks.forEach((book, idx) => {
      const div = document.createElement("div");
      div.className = "log-item";
      div.innerHTML = `
        <div class="log-head">
          <span>${escapeHtml(book)}</span>
          <button class="mini-btn" data-remove="${idx}">삭제</button>
        </div>
      `;
      div.querySelector('[data-remove]').onclick = () => removeBookFromList(idx);
      listEl.appendChild(div);
    });
  }

  async function addBookToList() {
    const input = $("newBookTitleInput");
    const statusEl = $("bookListStatus");
    const newBook = (input?.value || "").trim();

    if (!newBook) {
      statusEl.textContent = "책 제목을 입력해 주세요.";
      return;
    }

    if (currentBooks.includes(newBook)) {
      statusEl.textContent = "이미 등록된 책입니다.";
      return;
    }

    currentBooks.push(newBook);
    input.value = "";
    renderCurrentBooksList();
    statusEl.textContent = `"${newBook}" 추가됨. 설정 저장을 눌러야 반영됩니다.`;
  }

  function removeBookFromList(idx) {
    const statusEl = $("bookListStatus");
    if (currentBooks.length <= 1) {
      statusEl.textContent = "최소 1권의 책이 필요합니다.";
      return;
    }
    const removed = currentBooks.splice(idx, 1)[0];
    renderCurrentBooksList();
    statusEl.textContent = `"${removed}" 삭제됨. 설정 저장을 눌러야 반영됩니다.`;
  }

  async function saveClubSettings() {
    const statusEl = $("settingsStatus");
    statusEl.textContent = "저장 중...";

    const seasonId = ($("settingSeasonIdInput").value || "").trim();
    const seasonName = ($("settingSeasonNameInput").value || "").trim();
    const seasonStart = ($("settingSeasonStartInput").value || "").trim();
    const seasonEnd = ($("settingSeasonEndInput").value || "").trim();

    // 현재 메모리의 currentBooks 저장
    const booksToSave = [...currentBooks];

    const updates = [
      { key: "current_books", value: { titles: booksToSave } }
    ];

    if (seasonId || seasonName || (seasonStart && seasonEnd)) {
      updates.push({
        key: "season",
        value: {
          id: seasonId || "",
          name: seasonName || "",
          start: seasonStart || "",
          end: seasonEnd || ""
        }
      });
    }

    const { error } = await supabase.from("club_settings").upsert(updates, { onConflict: "key" });
    if (error) {
      console.error("saveClubSettings error:", error);
      statusEl.textContent = "저장 실패";
      return;
    }

    // 시즌 정보 업데이트
    const seasonData = updates.find(u => u.key === "season")?.value;
    if (seasonData) {
      currentSeason = seasonData;
    }

    // 헤더 업데이트
    const header = $("headerBookLabel");
    if (header) {
      const seasonTxt = currentSeason?.name ? ` · ${currentSeason.name}` : "";
      header.textContent = `Daily Reading${seasonTxt}`;
    }

    // 선택된 책이 목록에 없으면 첫 번째 책으로
    if (!currentBooks.includes(selectedBookTitle)) {
      selectedBookTitle = currentBooks[0];
    }

    statusEl.textContent = "저장 완료!";

    // renderApp() 대신 필요한 부분만 갱신 (탭 위치 유지)
    // 현재 책 목록 UI 갱신
    renderCurrentBooksList();

    // 멤버 관리 — 시즌 ID가 새로 생겼을 수 있으므로 즉시 갱신
    await loadMemberManager();
  }

  async function addAdminUser() {
    const statusEl = $("adminStatus");
    const uid = ($("adminUserIdInput").value || "").trim();
    if (!uid) { statusEl.textContent = "user_id를 입력해 주세요."; return; }

    statusEl.textContent = "추가 중...";
    const { error } = await supabase.from("admin_users").insert({ user_id: uid });

      statusEl.textContent = "추가 실패 (이미 존재하거나 권한/RLS 확인)";
      return;
    }

    loadAdminList();
